policy_id: "PII_PROTECTION_001"
name: "PII and Data Privacy Protection Policy"
version: "v1.0"
severity: "CRITICAL"
description: "Prevents exposure of sensitive personally identifiable information (PII) including credit card numbers, CVVs, full phone numbers, passwords, or cross-customer data leakage."
parameters:
  forbidden_patterns:
    - "\\b(?:4[0-9]{12}(?:[0-9]{3})?|5[1-5][0-9]{14}|3[47][0-9]{13}|3(?:0[0-5]|[68][0-9])[0-9]{11}|6(?:011|5[0-9]{2})[0-9]{12})\\b"  # Credit cards
    - "\\b\\+?[0-9]{1,3}[-.\\s]?\\(?\\d{3}\\)?[-.\\s]?\\d{3}[-.\\s]?\\d{4}\\b"  # Phone numbers
    - "\\b[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\\.[A-Z|a-z]{2,7}\\b"  # Plain exposed emails
enforcement:
  action_on_pii: "BLOCK"
  safe_response: "For your security, sensitive personal information and payment credentials cannot be shared in this channel."
  requires_human_review: true
