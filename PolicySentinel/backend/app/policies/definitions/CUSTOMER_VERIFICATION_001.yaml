policy_id: "CUSTOMER_VERIFICATION_001"
name: "Customer Identity Verification Policy"
version: "v1.0"
severity: "HIGH"
description: "Customer identity must be verified before accessing sensitive order information, initiating refunds, cancellations, or applying discounts."
parameters:
  sensitive_tools:
    - "process_refund"
    - "issue_refund"
    - "cancel_order"
    - "cancel_payment"
    - "update_delivery_address"
    - "get_customer_profile"
    - "update_customer_profile"
    - "get_customer_addresses"
    - "add_customer_address"
    - "get_customer_pii"
    - "get_order"
    - "get_order_history"
    - "get_order_status"
    - "get_payment_status"
    - "get_delivery_status"
    - "get_tracking_details"
    - "check_return_status"
    - "request_return"
    - "approve_return"
    - "export_customer_data"
    - "delete_customer_account"
enforcement:
  blocked_safe_response: "Please verify your identity with your registered phone number or email before we can access sensitive order details or process financial requests."
  requires_human_review: false
