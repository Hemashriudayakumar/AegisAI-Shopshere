{% extends "base.html" %}

{% block title %}Manage Products | ShopSphere Admin{% endblock %}

{% block content %}
<div class="container py-4">

  <div class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 pb-2 border-bottom">
    <div>
      <span class="badge bg-danger text-uppercase px-3 py-1 mb-1">Product Management</span>
      <h3 class="fw-bold text-dark mb-0">Inventory & Catalog</h3>
    </div>

    <div class="d-flex gap-2 mt-3 mt-md-0">
      <button class="btn btn-primary btn-sm rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#addProductModal">
        <i class="bi bi-plus-lg me-1"></i> Add Product
      </button>
      <a href="/admin" class="btn btn-outline-secondary btn-sm rounded-pill px-3">
        <i class="bi bi-arrow-left me-1"></i> Dashboard
      </a>
    </div>
  </div>

  <div class="card border-0 shadow-sm p-4 rounded-4 bg-white">
    <div class="table-responsive">
      <table class="table table-hover align-middle small">
        <thead class="table-light">
          <tr>
            <th>Product</th>
            <th>Category</th>
            <th>Brand</th>
            <th>Price</th>
            <th>Discount</th>
            <th>Stock</th>
            <th>Status</th>
            <th class="text-end">Actions</th>
          </tr>
        </thead>
        <tbody id="admin-products-table-body">
          <tr><td colspan="8" class="text-center py-4"><div class="spinner-border text-primary spinner-border-sm"></div></td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<!-- Add Product Modal -->
<div class="modal fade" id="addProductModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content rounded-4 border-0">
      <div class="modal-header">
        <h5 class="modal-title fw-bold">Add New Product</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <form onsubmit="handleCreateProduct(event)">
        <div class="modal-body">
          <div class="row g-3">
            <div class="col-md-8">
              <label class="form-label small fw-bold">Product Name</label>
              <input type="text" id="add-pname" class="form-control" placeholder="e.g. Smart Watch Pro" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">Brand</label>
              <input type="text" id="add-brand" class="form-control" placeholder="e.g. SphereTech" required>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Category</label>
              <select id="add-cat" class="form-select" required>
                <option value="Electronics">Electronics</option>
                <option value="Fashion">Fashion</option>
                <option value="Home">Home</option>
                <option value="Books">Books</option>
                <option value="Sports">Sports</option>
                <option value="Beauty">Beauty</option>
              </select>
            </div>
            <div class="col-md-6">
              <label class="form-label small fw-bold">Subcategory</label>
              <input type="text" id="add-subcat" class="form-control" placeholder="e.g. Headphones" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">Original Price (₹)</label>
              <input type="number" step="0.01" id="add-price" class="form-control" required>
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">Discount (%)</label>
              <input type="number" step="0.01" id="add-discount" class="form-control" value="0">
            </div>
            <div class="col-md-4">
              <label class="form-label small fw-bold">Stock Quantity</label>
              <input type="number" id="add-stock" class="form-control" value="25" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold">Image URL</label>
              <input type="url" id="add-img" class="form-control" value="https://images.unsplash.com/photo-1505740420928-5e560c06d30e?w=500&q=80" required>
            </div>
            <div class="col-12">
              <label class="form-label small fw-bold">Description</label>
              <textarea id="add-desc" class="form-control" rows="3" required></textarea>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary rounded-pill btn-sm" data-bs-dismiss="modal">Cancel</button>
          <button type="submit" class="btn btn-primary rounded-pill btn-sm">Create Product</button>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
  document.addEventListener('DOMContentLoaded', () => {
    loadAdminProducts();
  });

  async function loadAdminProducts() {
    const tbody = document.getElementById('admin-products-table-body');
    try {
      const res = await fetch('/api/admin/products?per_page=100');
      const data = await res.json();
      if (!data.success || !data.products) return;

      tbody.innerHTML = data.products.map(p => `
        <tr>
          <td>
            <div class="d-flex align-items-center">
              <img src="${p.image}" class="rounded me-2" style="width: 42px; height: 42px; object-fit: cover;">
              <div>
                <div class="fw-bold text-dark">${p.product_name}</div>
                <div class="text-muted font-monospace" style="font-size: 0.72rem;">${p.product_id}</div>
              </div>
            </div>
          </td>
          <td><span class="badge badge-soft-primary">${p.category}</span></td>
          <td>${p.brand}</td>
          <td class="fw-bold">₹${p.final_price.toLocaleString('en-IN')}</td>
          <td>${p.discount}%</td>
          <td>
            <div class="input-group input-group-sm" style="width: 100px;">
              <input type="number" class="form-control" id="stock-${p.product_id}" value="${p.stock_quantity}">
              <button class="btn btn-outline-secondary" onclick="updateStock('${p.product_id}')"><i class="bi bi-check"></i></button>
            </div>
          </td>
          <td>
            <span class="badge ${p.status === 'ACTIVE' ? 'bg-success' : 'bg-secondary'}">${p.status}</span>
          </td>
          <td class="text-end">
            <button class="btn btn-sm btn-outline-danger" onclick="deactivateProduct('${p.product_id}')" title="Deactivate">
              <i class="bi bi-trash"></i>
            </button>
          </td>
        </tr>
      `).join('');
    } catch (e) {
      console.error(e);
    }
  }

  async function updateStock(pid) {
    const qty = document.getElementById(`stock-${pid}`).value;
    try {
      const res = await fetch(`/api/admin/products/${pid}/stock`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ stock_quantity: qty })
      });
      const data = await res.json();
      if (data.success) {
        showToast('Stock quantity updated', 'success');
      } else {
        showToast(data.message, 'danger');
      }
    } catch (e) {
      showToast('Error updating stock', 'danger');
    }
  }

  async function deactivateProduct(pid) {
    if (!confirm(`Deactivate product ${pid}?`)) return;
    try {
      const res = await fetch(`/api/admin/products/${pid}`, { method: 'DELETE' });
      const data = await res.json();
      if (data.success) {
        showToast('Product deactivated', 'info');
        loadAdminProducts();
      }
    } catch (e) {
      showToast('Error deactivating product', 'danger');
    }
  }

  async function handleCreateProduct(e) {
    e.preventDefault();
    const payload = {
      product_name: document.getElementById('add-pname').value.trim(),
      brand: document.getElementById('add-brand').value.trim(),
      category: document.getElementById('add-cat').value,
      subcategory: document.getElementById('add-subcat').value.trim(),
      price: parseFloat(document.getElementById('add-price').value),
      discount: parseFloat(document.getElementById('add-discount').value) || 0,
      stock_quantity: parseInt(document.getElementById('add-stock').value) || 10,
      image: document.getElementById('add-img').value.trim(),
      description: document.getElementById('add-desc').value.trim()
    };

    try {
      const res = await fetch('/api/admin/products', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const data = await res.json();
      if (data.success) {
        showToast('Product created successfully!', 'success');
        const modal = bootstrap.Modal.getInstance(document.getElementById('addProductModal'));
        if (modal) modal.hide();
        loadAdminProducts();
      } else {
        showToast(data.message, 'danger');
      }
    } catch (err) {
      showToast('Error creating product', 'danger');
    }
  }
</script>
{% endblock %}
