<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}ShopSphere | Modern E-Commerce Platform{% endblock %}</title>
  
  <!-- Bootstrap 5.3 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- ShopSphere Custom CSS -->
  <link rel="stylesheet" href="/static/css/style.css">
  
  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- Navigation Bar -->
  {% include "components/navbar.html" %}

  <!-- Main Body Content -->
  <main class="flex-grow-1">
    {% block content %}{% endblock %}
  </main>

  <!-- Modern Footer -->
  {% include "components/footer.html" %}

  <!-- Floating AI Customer Support Chatbot -->
  {% include "components/chatbot.html" %}

  <!-- Global Toast Notification Container -->
  <div id="toast-container" class="toast-container position-fixed bottom-0 start-0 p-3" style="z-index: 1060;"></div>

  <!-- Bootstrap 5.3 Bundle JS -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <!-- ShopSphere Global JS -->
  <script src="/static/js/main.js"></script>
  <!-- AI Chatbot JS -->
  <script src="/static/js/chatbot.js"></script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
